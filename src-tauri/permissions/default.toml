[[permission]]
identifier = "allow-resource-history"
description = "Allow reading the resource sample history."
commands.allow = ["resource_history"]

[[permission]]
identifier = "allow-get-processes"
description = "Allow reading the current process list."
commands.allow = ["get_processes"]

[[permission]]
identifier = "allow-set-resource-streaming"
description = "Allow pausing and resuming the resource sampler."
