<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Windog</title>
    <script>
      (function () {
        try {
          const raw = localStorage.getItem("windog.theme");
          const saved = raw ? JSON.parse(raw) : {};
          const mode = saved.mode === "light" || saved.mode === "dark" ? saved.mode : "system";
          const accents = ["steel", "jade", "clay", "plum"];
          const accent = accents.indexOf(saved.accent) >= 0 ? saved.accent : "steel";
          const dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.dataset.accent = accent;
        } catch (error) {
          document.documentElement.dataset.accent = "steel";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
